name: 'Setup Misc Configs'
description: 'Set up kernel configuration fragment with miscellaneous options'
inputs:
  version:
    description: 'Kernel config version (e.g., android14-6.12)'
    required: true
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  android_version:
    description: 'Android version (e.g., android14)'
    required: true
  sublevel:
    description: 'Sublevel of kernel version (e.g., 1)'
    required: true
  variant:
    description: 'Build variant (Normal, Bypass, Wild, boot-time)'
    required: true

runs:
  using: "composite"
  steps:
    - name: Enable Kernel Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_OVERLAY_FS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          CONFIG_KALLSYMS_ALL=y

    - name: Enable Performance & Battery Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_HZ_300=y
          CONFIG_LRU_GEN=y
          CONFIG_LRU_GEN_ENABLED=y
          CONFIG_ZRAM=y
          CONFIG_ZRAM_DEF_COMP_LZ4=y
          CONFIG_ZRAM_DEF_COMP="lz4"

    - name: Enable NetHunter Configs
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_BT_HCIBTUSB=y
          CONFIG_BT_HCIBTUSB_BCM=y
          CONFIG_BT_HCIBTUSB_RTL=y
          CONFIG_BT_HCIUART=y
          CONFIG_BT_HCIUART_H4=y
          CONFIG_BT_HCIBCM203X=y
          CONFIG_BT_HCIBPA10X=y
          CONFIG_BT_HCIBFUSB=y
          CONFIG_BT_HCIVHCI=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_MAC80211=y
          CONFIG_MAC80211_MESH=y
          CONFIG_USB_RTL8150=y
          CONFIG_USB_RTL8152=y
          CONFIG_WLAN_VENDOR_ATH=y
          CONFIG_ATH9K_HTC=y
          CONFIG_CARL9170=y
          CONFIG_ATH6KL=y
          CONFIG_ATH6KL_USB=y
          CONFIG_WLAN_VENDOR_MEDIATEK=y
          CONFIG_MT7601U=y
          CONFIG_WLAN_VENDOR_RALINK=y
          CONFIG_RT2X00=y
          CONFIG_RT2500USB=y
          CONFIG_RT73USB=y
          CONFIG_RT2800USB=y
          CONFIG_RT2800USB_RT33XX=y
          CONFIG_RT2800USB_RT35XX=y
          CONFIG_RT2800USB_RT3573=y
          CONFIG_RT2800USB_RT53XX=y
          CONFIG_RT2800USB_RT55XX=y
          CONFIG_RT2800USB_UNKNOWN=y
