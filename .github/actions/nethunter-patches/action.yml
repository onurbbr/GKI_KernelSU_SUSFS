name: 'Apply NetHunter WiFi Injection Patch'
description: 'Apply GKI-adapted NetHunter frame-injection patch (kernels 5.10/5.15/6.1/6.6)'
inputs:
  kernel_version:
    description: 'Kernel version (e.g., 6.1)'
    required: true
  commit:
    description: 'Pinned kali-nethunter-kernel-patches commit SHA'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Apply NetHunter WiFi Injection Patch
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/common
      run: |
        set -euo pipefail
        KERNEL_VERSION="${{ inputs.kernel_version }}"
        case "$KERNEL_VERSION" in
          5.10|5.15|6.1|6.6) ;;
          *)
            echo "No NetHunter injection patch for kernel $KERNEL_VERSION, skipping"
            exit 0
            ;;
        esac
        if ! [[ "${{ inputs.commit }}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "NetHunter patches commit must be a full 40-character SHA." >&2
          exit 2
        fi
        curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --connect-timeout 30 \
          "https://raw.githubusercontent.com/wumingzhinu/kali-nethunter-kernel-patches/${{ inputs.commit }}/adapted/${KERNEL_VERSION}/add-wifi-injection-${KERNEL_VERSION}.patch" \
          -o /tmp/nethunter-injection.patch
        patch -p1 --forward < /tmp/nethunter-injection.patch
        echo "[+] NetHunter WiFi injection patch applied for $KERNEL_VERSION"
